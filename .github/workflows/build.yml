name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 빌드 (build.bat)
        shell: cmd
        run: call build.bat

      - name: 실행 파일 해시 출력
        shell: pwsh
        run: |
          $f = Get-ChildItem bin\*.exe | Select-Object -First 1
          Write-Host "실행 파일: $($f.Name)"
          Get-FileHash $f.FullName -Algorithm SHA256 | Format-List

      - name: 실행 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: mong-capture-exe
          path: bin/*.exe
          if-no-files-found: error
