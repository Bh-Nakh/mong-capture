name: build

# 소스가 main 에 푸시되면 빌드하고, 버전이 올라갔으면 이 저장소의 Release(v1)에 업데이트 파일과 latest.json 을 올린다.
# 손으로 돌릴 때(workflow_dispatch) 태그를 바꾸면 시험용 Release(미리보기)에 올린다.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "올릴 Release 태그 (시험할 때만 바꾼다)"
        default: v1

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 빌드 (build.bat)
        shell: cmd
        run: call build.bat

      - name: 실행 파일 해시 출력
        shell: pwsh
        run: |
          $f = Get-ChildItem bin\*.exe | Select-Object -First 1
          Write-Host "실행 파일: $($f.Name)"
          Get-FileHash $f.FullName -Algorithm SHA256 | Format-List

      - name: 실행 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: mong-capture-exe
          path: bin/*.exe
          if-no-files-found: error

      - name: 새 버전이면 Release 에 올리기
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/mong_publish.ps1 -App mongcapture -VersionFile 'src/AssemblyInfo.cs' -VersionPattern 'AssemblyInformationalVersion\("([^"]+)"' -File 'bin/*.exe' -AssetName MongCapture.exe -Kind exe -Tag "${{ github.event.inputs.tag || 'v1' }}"
